name: CI

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run unit tests
        run: go test -short ./... -race -coverprofile=coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cnlangzi/knownbots

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run benchmarks
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Hot Path Performance (Validate with verified bot)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '| CPUs | ns/op | QPS | Allocs |' >> $GITHUB_STEP_SUMMARY
          echo '|------|-------|-----|--------|' >> $GITHUB_STEP_SUMMARY
          
          # Run benchmarks and capture output
          go test -run=^$ -bench=. -benchmem -cpu=1,4,8 -timeout 120s 2>&1 | tee benchmark_output.txt
          
          # Extract and format key metrics
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Component Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '| Benchmark | 4 CPUs (ns/op) | 8 CPUs (ns/op) |' >> $GITHUB_STEP_SUMMARY
          echo '|-----------|----------------|----------------|' >> $GITHUB_STEP_SUMMARY
          
          # Parse benchmark output and add to summary
          grep -E "Benchmark(FindBotByUA|ContainsIP|ClassifyUA).*-[48]" benchmark_output.txt | \
            awk '{gsub(/Benchmark/, ""); gsub(/-[48]/, ""); split($0, a); 
                  if(a[1] ~ /ContainsIP/) row="ContainsIP"; 
                  else if(a[1] ~ /FindBotByUA/) row="FindBotByUA"; 
                  else if(a[1] ~ /ClassifyUA/) row="ClassifyUA";
                  printf "| %s | %s ns/op | %s ns/op |\n", row, a[2], a[3]}' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Note: Zero allocations (0 B/op, 0 allocs/op) indicate GC-free hot paths*" >> $GITHUB_STEP_SUMMARY

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchmark_output.txt', 'utf8');
            const lines = output.split('\n');
            
            let comment = '## Benchmark Results\n\n';
            
            // Extract Validate benchmark results
            const validateResults = [];
            let containsIPns = null;
            let findBotByUAns = null;
            
            for (const line of lines) {
              if (line.includes('BenchmarkValidate_WithBotUA')) {
                // Format: BenchmarkValidate_WithBotUA-1    807.8 ns/op         0 B/op          0 allocs/op
                // parts: [name-iterations, ns/op, B/op, allocs/op]
                const parts = line.trim().split(/\s+/);
                // Find CPU from benchmark name suffix (-1, -4, -8)
                const nameParts = parts[0].split('-');
                const cpu = nameParts[nameParts.length - 1];
                const ns = parts[1];
                // B/op is the 3rd column (parts[2]), but may have spaces
                const bPerOp = parts[2] === 'ns/op' ? '0' : parts[2];
                // Find the numeric value before "B/op"
                const bMatch = line.match(/(\d+)\s+B\/op/);
                const actualBPerOp = bMatch ? bMatch[1] : '0';
                // Find allocs count
                const allocsMatch = line.match(/(\d+)\s+allocs\/op/);
                const allocs = allocsMatch ? allocsMatch[1] : '0';
                validateResults.push({ cpu, ns, bPerOp: actualBPerOp, allocs });
              }
              if (line.includes('BenchmarkContainsIP')) {
                const parts = line.trim().split(/\s+/);
                containsIPns = parts[1];
              }
              if (line.includes('BenchmarkFindBotByUA')) {
                const parts = line.trim().split(/\s+/);
                findBotByUAns = parts[1];
              }
            }
            
            // Build comment
            comment += '### Validate (Hot Path)\n';
            comment += '| CPUs | ns/op | B/op | Allocs |';
            comment += '\n|------|-------|------|--------|\n';
            for (const r of validateResults) {
              comment += `| ${r.cpu} | ${r.ns} | ${r.bPerOp} | ${r.allocs} |\n`;
            }
            
            // Generate observations based on actual results
            const observations = [];
            if (validateResults.length > 0) {
              const hasZeroAllocs = validateResults.every(r => r.allocs === '0');
              if (hasZeroAllocs) {
                observations.push('✅ Zero allocations on hot path (GC-free)');
              }
              if (containsIPns && findBotByUAns) {
                const ratio = (parseInt(containsIPns) / parseInt(findBotByUAns)).toFixed(2);
                observations.push(`⚡ ContainsIP is ${ratio}x faster than FindBotByUA`);
              }
            }
            
            if (observations.length > 0) {
              comment += '\n### Observations\n';
              comment += observations.join('\n') + '\n';
            }
            
            // Find existing benchmark comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.startsWith('## Benchmark Results')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
              console.log('Updated existing benchmark comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              console.log('Created new benchmark comment');
            }
